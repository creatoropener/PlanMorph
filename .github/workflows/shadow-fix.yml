name: Shadow Fix

on:
  issues:
    types: [labeled]

concurrency:
  group: shadow-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.label.name == 'shadow-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: creatoropener/shadow-patch@93443eaddbfb3ade8989d57750009e45ca462d2c
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          nebius-project-id: ${{ secrets.NEBIUS_PROJECT_ID }}
          nebius-model: ${{ vars.NEBIUS_MODEL }}
          sandbox-image: ${{ secrets.CONTREE_IMAGE }}
          agent-mode: legacy
          nebius-max-tokens: '12000'
